<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>מעבירים אתכם…</title>
<style>
:root { --bg: #E3E7EA; --ink: #1C2830; --brass: #A87B22; color-scheme: light; box-sizing: border-box; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #1A242B; --ink: #EEF1F3; --brass: #D6AE4E; color-scheme: dark; } }
:root[data-theme="dark"] { --bg: #1A242B; --ink: #EEF1F3; --brass: #D6AE4E; color-scheme: dark; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: "Rubik", "Arial", sans-serif; display: grid; place-items: center; text-align: center; padding: 24px; box-sizing: border-box; }
.spin { width: 44px; height: 44px; border-radius: 50%; border: 4px solid rgba(168,123,34,.25); border-top-color: var(--brass); animation: s .8s linear infinite; margin: 0 auto 16px; }
@keyframes s { to { transform: rotate(360deg); } }
a { color: var(--brass); }
</style>
</head>
<body>
<div>
  <div class="spin" aria-hidden="true"></div>
  <p id="msg">מעבירים אתכם…</p>
  <p><a id="manual" href="#" hidden>לא קרה כלום? לחצו כאן</a></p>
</div>
<script>
/* ====== הגדרות כלליות – זהות לדף הטאבלט ====== */
const SUPABASE_URL = 'https://ojczheigsisebhnycehw.supabase.co';
const SUPABASE_KEY = 'sb_publishable_Q2lx3QG3iP7h81Qu5m-_-A_74G8sUYq';
const DEFAULT_BIZ = 'super-mafteach';
const FALLBACK = {
  'super-mafteach': {
    name: 'סופר מפתח טמבוריה',
    place_id: 'ChIJu7gRsONNHRUR5loHwOCrSWM',
    maps_query: 'סופר מפתח טמבוריה בוגרשוב 11 תל אביב',
    whatsapp: '972522529604',
    whatsapp_text: 'שלום, יש לי הערה על הביקור שלי בסופר מפתח:'
  }
};

const params = new URLSearchParams(location.search);
const BIZ = (params.get('b') || DEFAULT_BIZ).trim().toLowerCase();
const SRC = (params.get('s') || 'qr').toLowerCase();
const isWa = SRC === 'wa';
const sbReady = /^https:\/\//.test(SUPABASE_URL) && SUPABASE_KEY.length > 20;

function headers(json) { const h = { apikey: SUPABASE_KEY }; if (json) h['Content-Type'] = 'application/json'; return h; }
function deviceName() {
  const ua = navigator.userAgent;
  if (/iPad/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1)) return 'אייפד';
  if (/iPhone/.test(ua)) return 'אייפון';
  if (/Android/.test(ua)) return 'אנדרואיד';
  return 'מחשב';
}
function destFor(b) {
  if (isWa) return b.whatsapp ? 'https://wa.me/' + b.whatsapp + '?text=' + encodeURIComponent(b.whatsapp_text || '') : null;
  if (b.place_id) return 'https://search.google.com/local/writereview?placeid=' + encodeURIComponent(b.place_id);
  if (b.maps_query || b.name) return 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(b.maps_query || b.name);
  return null;
}
const withTimeout = (p, ms) => Promise.race([p, new Promise(r => setTimeout(() => r(null), ms))]);

async function getBusiness() {
  if (!sbReady) return null;
  try {
    const r = await fetch(SUPABASE_URL + '/rest/v1/businesses?slug=eq.' + encodeURIComponent(BIZ) + '&select=slug,name,place_id,maps_query,whatsapp,whatsapp_text', { headers: headers(false), cache: 'no-store' });
    if (!r.ok) return null;
    const rows = await r.json();
    return rows[0] || null;
  } catch (e) { return null; }
}

async function logScan() {
  if (!sbReady) return;
  const body = JSON.stringify({
    p_biz: BIZ,
    p_event: isWa ? 'פתיחת וואטסאפ' : 'סריקה לגוגל',
    p_source: SRC === 'nfc' ? 'NFC' : 'QR',
    p_device: deviceName()
  });
  const send = base => fetch(base + '/rest/v1/rpc/log_event', { method: 'POST', headers: headers(true), body: body, cache: 'no-store' });
  try { await send(SUPABASE_URL); }
  catch (e) { try { await send(location.origin + '/sb'); } catch (e2) {} }
}

(async () => {
  const [fromDb] = await Promise.all([withTimeout(getBusiness(), 2500), withTimeout(logScan(), 2500)]);
  const info = fromDb || FALLBACK[BIZ];
  const dest = info && destFor(info);
  if (dest) {
    const a = document.getElementById('manual');
    a.href = dest; a.hidden = false;
    location.replace(dest);
  } else {
    document.getElementById('msg').textContent = 'משהו השתבש. נסו לסרוק שוב בעוד רגע.';
  }
})();
</script>
</body>
</html>
